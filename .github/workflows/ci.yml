name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    name: Extension checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check environment
        run: npm run check

      - name: Type-check extension
        run: npm run typecheck 2>&1 | tee typecheck.log

      - name: Test Council, context graph, and runtime
        run: npm test 2>&1 | tee test.log

      - name: Build extension
        run: npm run build 2>&1 | tee build.log

      - name: Verify native overlay sources
        run: npm run native:verify-source 2>&1 | tee native-verify.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-check-diagnostics
          path: |
            typecheck.log
            test.log
            build.log
            native-verify.log
          if-no-files-found: ignore
