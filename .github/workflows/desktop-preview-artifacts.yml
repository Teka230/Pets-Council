name: Desktop Preview artifacts

on:
  workflow_dispatch:
    inputs:
      preview_version:
        description: Preview version written into manifests
        required: true
        default: 0.1.0-preview.1
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-14
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Pets Council dependencies
        run: npm install

      - name: Bootstrap patched Code - OSS
        run: npm run bootstrap

      - name: Package patched Code - OSS
        working-directory: .vendor/vscode
        run: npm run gulp vscode-${{ matrix.target }}

      - name: Create verified Preview archive
        run: node scripts/package-preview-artifact.mjs --target ${{ matrix.target }} --version ${{ inputs.preview_version }}

      - name: Upload Preview archive and manifest
        uses: actions/upload-artifact@v4
        with:
          name: pets-council-preview-${{ matrix.target }}
          path: artifacts/desktop-preview/*-${{ matrix.target }}.*
          if-no-files-found: error
